<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telugu Panchangam Calendar - Traditional Astro Calendar</title>
    <meta name="description" content="A production-grade Telugu Panchangam Calendar Web App resembling Google Calendar, calculating Tithis, Nakshatrams, Muhurthams, and Graha positions dynamically.">
    <link rel="icon" href="public/favicon.ico">
    
    <!-- Google Fonts: Orbitron for cosmic text, Inter for clean layout -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css?v=modular">
</head>
<body>
    <!-- Starry Canvas Background (shown in Cosmic theme) -->
    <div class="stars-container" id="stars-container">
        <canvas id="starfield-canvas"></canvas>
        <div class="nebula-overlay"></div>
    </div>

    <!-- Scanline effect for Cosmic Monitor theme -->
    <div class="scanlines" id="scanlines-overlay"></div>

    <!-- Main Google Calendar-style Grid -->
    <div class="dashboard-wrapper">
        <!-- Top Google-Style Header -->
        <header class="dashboard-header">
            <div class="header-left flex-align-center">
                <button id="btn-sidebar-toggle" class="sidebar-toggle-btn" title="Toggle Sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="logo-circle"><i class="fa-solid fa-sun-plant-wilt"></i></div>
                <div class="title-group">
                    <h1>తెలుగు పంచాంగం</h1>
                    <p class="subtitle">TELUGU PANCHANGAM</p>
                </div>
            </div>
            
            <!-- Center: Search Location with Autocomplete -->
            <div class="header-center flex-align-center">
                <div class="location-search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="location-search-input" placeholder="Search global city (e.g. Hyderabad, London, Dallas)..." autocomplete="off" aria-label="Search city name">
                    <button class="clear-btn hidden" id="btn-clear-search" type="button" title="Clear Search"><i class="fa-solid fa-xmark"></i></button>
                    <button class="gps-btn" id="btn-gps-location" type="button" title="Use current GPS coordinates">
                        <i class="fa-solid fa-location-crosshairs"></i> GPS
                    </button>
                    <div class="autocomplete-dropdown-panel hidden" id="location-autocomplete-list"></div>
                </div>
            </div>

            <!-- Right: View Selector, Themes & Audio Control -->
            <div class="header-right flex-align-center">
                <!-- Today & Navigation -->
                <div class="calendar-nav-controls flex-align-center">
                    <button id="btn-today" class="nav-btn today-btn">Today</button>
                    <button id="btn-prev" class="nav-btn icon-btn" title="Previous"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="btn-next" class="nav-btn icon-btn" title="Next"><i class="fa-solid fa-chevron-right"></i></button>
                    <span id="label-current-range" class="current-range-label">Syncing...</span>
                </div>

                <!-- View Switcher -->
                <div class="view-selector-wrapper">
                    <select id="select-view" class="view-dropdown" aria-label="Select calendar view">
                        <option value="month">Month</option>
                        <option value="week">Week</option>
                        <option value="day">Day</option>
                    </select>
                </div>

                <!-- Audio control buttons -->
                <div class="audio-control-group flex-align-center">
                    <button class="header-icon-btn" id="btn-ambient-audio" title="Ambient Sound Toggle">
                        <i class="fa-solid fa-volume-xmark" id="audio-icon"></i>
                    </button>
                    <button class="header-icon-btn" id="btn-sound-effects" title="SFX Toggle">
                        <i class="fa-solid fa-volume-high" id="sfx-icon"></i>
                    </button>
                </div>

                <!-- Theme Toggle Button -->
                <button id="btn-theme-toggle" class="header-icon-btn theme-toggle-btn" title="Switch Theme (Light / Dark / Cosmic)">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
        </header>

        <!-- Body content: Split into sidebar and central views -->
        <main class="dashboard-body">
            <!-- Left Sidebar -->
            <aside class="calendar-sidebar" id="calendar-sidebar" aria-label="Sidebar Calendar Controls">
                <!-- Sidebar Mini Calendar Container -->
                <div class="sidebar-section mini-calendar-section">
                    <div id="mini-calendar" class="mini-calendar-wrapper">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <!-- Active Location display & Favorites Toggle -->
                <div class="sidebar-section location-info-section">
                    <h3 class="section-title"><i class="fa-solid fa-map-location-dot"></i> Selected Location</h3>
                    <div class="active-location-card">
                        <div class="location-details">
                            <strong id="active-location-name">Hyderabad</strong>
                            <span id="active-location-tz">Asia/Kolkata</span>
                        </div>
                        <button class="favorite-toggle-btn" id="btn-toggle-favorite" title="Add to Favorites">
                            <i class="fa-regular fa-star" id="favorite-star-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Location Badges -->
                <div class="sidebar-section location-badges-section">
                    <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Recents</h3>
                    <div class="badge-list" id="recents-list">
                        <span class="no-badges">None</span>
                    </div>
                    
                    <h3 class="section-title" style="margin-top: 12px;"><i class="fa-solid fa-star"></i> Favorites</h3>
                    <div class="badge-list" id="favorites-list">
                        <span class="no-badges">None</span>
                    </div>
                </div>

                <!-- Calendar Layers checkboxes -->
                <div class="sidebar-section layers-section">
                    <h3 class="section-title"><i class="fa-solid fa-layer-group"></i> Calendar Layers</h3>
                    <div class="layer-checkbox-list">
                        <label class="layer-checkbox-item">
                            <input type="checkbox" id="layer-festivals" checked>
                            <span class="checkbox-custom"></span>
                            <span class="layer-label festivals"><i class="fa-solid fa-cake-candles"></i> Festivals (పండుగలు)</span>
                        </label>
                        <label class="layer-checkbox-item">
                            <input type="checkbox" id="layer-muhurthams" checked>
                            <span class="checkbox-custom"></span>
                            <span class="layer-label muhurthams"><i class="fa-solid fa-clock"></i> Muhurthams (అభిజిత్, రాహుకాలం)</span>
                        </label>
                        <label class="layer-checkbox-item">
                            <input type="checkbox" id="layer-inauspicious" checked>
                            <span class="checkbox-custom"></span>
                            <span class="layer-label inauspicious"><i class="fa-solid fa-triangle-exclamation"></i> Inauspicious (వర్జ్యం, దుర్మ..)</span>
                        </label>
                        <label class="layer-checkbox-item">
                            <input type="checkbox" id="layer-grahas" checked>
                            <span class="checkbox-custom"></span>
                            <span class="layer-label grahas"><i class="fa-solid fa-chart-pie"></i> Graha Rasi Chart (గ్రహచార్ట్)</span>
                        </label>
                    </div>
                </div>
            </aside>

            <!-- Main Calendar View -->
            <section class="calendar-main" aria-label="Calendar Grid View">
                <!-- Main dynamic grid container where Month, Week, or Day is rendered -->
                <div id="main-calendar-view" class="calendar-view-container">
                    <!-- Rendered by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Event Detail Popup Modal -->
    <div class="event-modal-overlay hidden" id="event-modal">
        <div class="event-modal-content">
            <div class="event-modal-header">
                <h2 id="modal-title">Festival or Panchangam Day Details</h2>
                <button id="btn-close-modal" class="modal-close-btn" title="Close Modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="event-modal-body" id="modal-body">
                <!-- Content injected dynamically -->
            </div>
            <div class="event-modal-footer">
                <button id="btn-modal-ok" class="modal-ok-btn">OK</button>
            </div>
        </div>
    </div>

    <!-- Offline Falling back toast notification -->
    <div class="offline-toast hidden" id="offline-toast">
        <i class="fa-solid fa-wifi-slash"></i> Offline mode active: Using client approximations.
    </div>

    <!-- JS dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
